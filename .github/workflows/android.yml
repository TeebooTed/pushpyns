name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble, test, ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Assemble, test, and ktlint
        run: ./gradlew assembleDebug test ktlintCheck --stacktrace
