[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
composeBom = "2026.09.00"
hilt = "2.60.1"
hiltNavigation = "1.4.0"
room = "2.8.5"
navigation = "2.10.2"
lifecycle = "2.11.0"
activity = "1.13.0"
core = "1.19.1"
mapsCompose = "9.0.1"
playServicesMaps = "20.1.0"
playServicesLocation = "21.4.0"
coil = "3.6.3"
datastore = "1.3.0"
coroutines = "1.11.0"
secrets = "2.0.1"
ktlint = "14.2.0"
